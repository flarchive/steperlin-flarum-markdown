name: Build and Test

on:
  push:
    branches: [ main, develop, 2.x ]
  pull_request:
    branches: [ main, 2.x ]
  release:
    types: [published]

jobs:
  js-build:
    name: JavaScript Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16, 18, 20]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: js/package-lock.json

    - name: Install dependencies
      run: |
        cd js
        npm ci

    - name: Check formatting
      run: |
        cd js
        npm run format-check

    - name: Build extension
      run: |
        cd js
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: js-dist-node-${{ matrix.node-version }}
        path: js/dist/

  php-test:
    name: PHP Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.1, 8.2, 8.3]

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: js/package-lock.json

    - name: Install dependencies
      run: |
        cd js
        npm ci

    - name: Run security audit
      run: |
        cd js
        npm audit --audit-level high

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHP security check
      run: |
        composer require --dev roave/security-advisories:dev-latest || true

  notify-packagist:
    name: Notify Packagist
    runs-on: ubuntu-latest
    needs: [js-build, php-test, security]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: Update Packagist
      run: |
        curl -XPOST -H'content-type:application/json' \
             'https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}' \
             -d'{"repository":{"url":"https://packagist.org/packages/steperlin/flarum-markdown"}}'
      continue-on-error: true