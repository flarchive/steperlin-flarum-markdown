<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0d1117" rx="15"/>
  
  <!-- Markdown "M" Symbol -->
  <g fill="url(#gradient)" stroke="none">
    <!-- Left side of M -->
    <polygon points="15,25 15,75 22,75 22,38 30,58 35,58 43,38 43,75 50,75 50,25 40,25 32.5,50 25,25"/>
    
    <!-- Down arrow (markdown symbol) -->
    <polygon points="60,35 85,35 85,42 75,42 75,55 68,55 68,42 60,42"/>
    <polygon points="68,55 72.5,65 77,55 85,55 72.5,75 60,55"/>
  </g>
  
  <!-- Highlight dots -->
  <circle cx="20" cy="20" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="80" cy="20" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="20" cy="80" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="80" cy="80" r="2" fill="#58a6ff" opacity="0.6"/>
</svg>